name: Release APK

# Push a tag such as v2.4.0 (or run manually) to build the signed release APK and publish
# it as a GitHub Release asset. Requires the repository secrets:
#   REDX_KEYSTORE_BASE64, REDX_KEYSTORE_PASSWORD, REDX_KEY_ALIAS, REDX_KEY_PASSWORD
# Android only installs an update over an existing app when the signature matches. With the
# secrets set, the APK is signed with the maintainer's key (installs as an update). Without
# them, a one-off key is generated for this build so a complete, installable APK is still
# published; it is clearly labelled in the release notes because it cannot update installs
# signed with the original key. The workflow never publishes an unsigned APK.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v2.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          REDX_KEYSTORE_BASE64: ${{ secrets.REDX_KEYSTORE_BASE64 }}
          IN_KEYSTORE_PASSWORD: ${{ secrets.REDX_KEYSTORE_PASSWORD }}
          IN_KEY_ALIAS: ${{ secrets.REDX_KEY_ALIAS }}
          IN_KEY_PASSWORD: ${{ secrets.REDX_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/redx-release.jks"
          if [ -n "$REDX_KEYSTORE_BASE64" ] && [ -n "$IN_KEYSTORE_PASSWORD" ] && [ -n "$IN_KEY_ALIAS" ] && [ -n "$IN_KEY_PASSWORD" ]; then
            echo "$REDX_KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PW="$IN_KEYSTORE_PASSWORD"; ALIAS="$IN_KEY_ALIAS"; KEY_PW="$IN_KEY_PASSWORD"
            echo "SIGNING_MODE=maintainer" >> "$GITHUB_ENV"
            echo "Signing with the maintainer keystore from repository secrets."
          else
            echo "::warning::Signing secrets are not set. Generating a one-off key; this APK cannot update installs signed with the original key."
            STORE_PW="$(openssl rand -hex 16)"; ALIAS="redx"; KEY_PW="$STORE_PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RedX, O=RedX CI"
            echo "SIGNING_MODE=generated" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$STORE_PW"
          {
            echo "REDX_KEYSTORE_FILE=$KS"
            echo "REDX_KEYSTORE_PASSWORD=$STORE_PW"
            echo "REDX_KEY_ALIAS=$ALIAS"
            echo "REDX_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK"
          case "$APK" in
            *unsigned*) echo "::error::Release APK is unsigned"; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "redx-${RELEASE_TAG}.apk"
          cp "$APK" redx.apk

      - name: Write release notes
        run: |
          if [ "$SIGNING_MODE" = "maintainer" ]; then
            SIGN_NOTE="It is signed with the same key as earlier releases, so it installs over an existing RedX."
          else
            SIGN_NOTE="> **Signing note:** this build is signed with a **new key** (the original release key is not available to CI). It installs normally on a fresh device, but Android will not update an existing RedX signed with a different key: **uninstall the old RedX once, then install this APK.** Saved posts and settings are stored on-device and are not carried over."
          fi
          # Per-version notes live in docs/release-notes/<tag>.md so each release describes
          # its own changes instead of a hard-coded list.
          NOTES_SRC="docs/release-notes/${RELEASE_TAG}.md"
          {
            echo "# RedX ${RELEASE_TAG}"
            echo
            echo "**Download \`redx.apk\` below: it is the complete, installable app** (the same file is also attached as \`redx-${RELEASE_TAG}.apk\`)."
            echo
            echo "${SIGN_NOTE}"
            echo
            if [ -f "$NOTES_SRC" ]; then
              cat "$NOTES_SRC"
            else
              echo "See the commit history for the changes in this release."
            fi
            echo
            echo "Full issue-by-issue list: [AUDIT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/AUDIT.md)"
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          else
            # --target pins a newly created tag to the commit that was built.
            gh release create "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk \
              --target "$GITHUB_SHA" \
              --title "RedX ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
