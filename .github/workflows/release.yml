name: Release APK

# Push a tag such as v2.4.0 (or run manually) to build the signed release APK and publish
# it as a GitHub Release asset. Requires the repository secrets:
#   REDX_KEYSTORE_BASE64, REDX_KEYSTORE_PASSWORD, REDX_KEY_ALIAS, REDX_KEY_PASSWORD
# Android only installs an update over an existing app when the signature matches, so this
# workflow refuses to publish an unsigned or debug-signed APK.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v2.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          REDX_KEYSTORE_BASE64: ${{ secrets.REDX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$REDX_KEYSTORE_BASE64" ]; then
            echo "::error::REDX_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$REDX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/redx-release.jks"
          echo "REDX_KEYSTORE_FILE=$RUNNER_TEMP/redx-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        env:
          REDX_KEYSTORE_PASSWORD: ${{ secrets.REDX_KEYSTORE_PASSWORD }}
          REDX_KEY_ALIAS: ${{ secrets.REDX_KEY_ALIAS }}
          REDX_KEY_PASSWORD: ${{ secrets.REDX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK"
          case "$APK" in
            *unsigned*) echo "::error::Release APK is unsigned"; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "redx-${RELEASE_TAG}.apk"
          cp "$APK" redx.apk

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # RedX ${RELEASE_TAG} — UI & Data Bug-Fix Release

          **Download \`redx.apk\` below: it is the complete, installable app** (the same file is also attached as \`redx-${RELEASE_TAG}.apk\`). It is signed with the same key as earlier releases, so it installs over an existing RedX.

          ## What's new
          - **System UI:** dark window theme (no white launch flash) and light status/nav icons on light-mode phones; the phone toolbar no longer draws under the status bar; phones in landscape no longer get the cramped tablet layout.
          - **Feed:** pagination no longer retries forever on failure (retry button instead) and never appends unrelated search results; scroll-to-top works in Gallery and tablet grid views; edge-swipe no longer swallows touches.
          - **Data:** RSS posts no longer show the subreddit as a fake flair or "submitted by..." as the post body; unknown scores show a dash instead of 0; the login session cookie is no longer dropped from authenticated requests; signed-out user profiles work.
          - **Video:** scrolling over a video no longer pauses it or triggers 2x speed; audio focus and headphone-unplug handling; poster until the first frame; feed videos pause under the lightbox; RedGifs embeds are tap-to-play; new **Autoplay videos in feed** setting.
          - **Cards & dialogs:** default Cards view margins fixed; gallery posts open as a multi-image lightbox; long posts can be read aloud; Search, Account, Share and other dialogs scroll; search respects the mature-content setting.

          Full issue-by-issue list: [AUDIT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/AUDIT.md)
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          else
            # --target pins a newly created tag to the commit that was built.
            gh release create "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk \
              --target "$GITHUB_SHA" \
              --title "RedX ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
