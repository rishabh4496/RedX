name: Release APK

# Push a tag such as v2.4.0 (or run manually) to build the signed release APK and publish
# it as a GitHub Release asset. Requires the repository secrets:
#   REDX_KEYSTORE_BASE64, REDX_KEYSTORE_PASSWORD, REDX_KEY_ALIAS, REDX_KEY_PASSWORD
# Android only installs an update over an existing app when the signature matches, so this
# workflow refuses to publish an unsigned or debug-signed APK.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v2.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          REDX_KEYSTORE_BASE64: ${{ secrets.REDX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$REDX_KEYSTORE_BASE64" ]; then
            echo "::error::REDX_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$REDX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/redx-release.jks"
          echo "REDX_KEYSTORE_FILE=$RUNNER_TEMP/redx-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        env:
          REDX_KEYSTORE_PASSWORD: ${{ secrets.REDX_KEYSTORE_PASSWORD }}
          REDX_KEY_ALIAS: ${{ secrets.REDX_KEY_ALIAS }}
          REDX_KEY_PASSWORD: ${{ secrets.REDX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK"
          case "$APK" in
            *unsigned*) echo "::error::Release APK is unsigned"; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "redx-${RELEASE_TAG}.apk"
          cp "$APK" redx.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk --clobber
          else
            gh release create "$RELEASE_TAG" "redx-${RELEASE_TAG}.apk" redx.apk \
              --title "RedX ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
